<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Alkish Car Controller</title>
<style>
  :root {
    --bg: #000;
    --panel: #161b22;
    --outer-ring: #2a3340;
    --outer-fill: #1a2028;
    --accent: #3b9eff;
    --accent-glow: rgba(59, 158, 255, 0.55);
    --knob-top: #4fb3ff;
    --knob-bottom: #1f6fbf;
    --text: #e6edf3;
    --text-dim: #7d8a9a;
    --arrow-idle: #3a4552;
    --arrow-active: #3b9eff;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    background:
      radial-gradient(circle at 50% 30%, rgba(22, 28, 36, 0.88) 0%, rgba(13, 17, 23, 0.88) 70%),
      url('car-bg.jpeg') center 65% / auto 30vh no-repeat,
      var(--bg);
    overscroll-behavior: none;
    touch-action: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    user-select: none;
  }

  .brand {
    position: fixed;
    top: max(24px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .brand-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .brand-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    background: linear-gradient(135deg, var(--knob-top), var(--knob-bottom));
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  .brand-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.01em;
    line-height: 1;
    background: linear-gradient(135deg, #8fd0ff 0%, #3b9eff 55%, #1f6fbf 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-align: center;
  }

  .brand-sub {
    position: fixed;
    bottom: max(10px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    z-index: 150;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .brand-sub-line {
    font-weight: 700;
    letter-spacing: 0.42em;
    padding-left: 0.42em;
    line-height: 1.3;
  }

  .brand-sub-line-1 {
    font-size: 13px;
  }

  .brand-sub-line-2 {
    font-size: 19px;
  }

  .connection {
    position: fixed;
    top: max(8px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 150;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 9px 16px;
    background: var(--panel);
    border: 1px solid #232b35;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #555;
    flex-shrink: 0;
  }

  .status-dot[data-state="connected"] {
    background: #3ddc73;
    box-shadow: 0 0 8px rgba(61, 220, 115, 0.8);
  }

  .status-dot[data-state="connecting"] {
    background: #f5a623;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .status-text {
    font-size: 12px;
    color: var(--text-dim);
    min-width: 84px;
  }

  #wsUrlInput {
    background: #0d1117;
    border: 1px solid #2a3340;
    color: var(--text);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 13px;
    width: 190px;
    display: none;
  }

  #wsUrlInput:focus {
    outline: none;
    border-color: var(--accent);
  }

  #connectBtn {
    background: linear-gradient(135deg, var(--knob-top), var(--knob-bottom));
    border: none;
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  #connectBtn.connected {
    background: linear-gradient(135deg, #ff6a53, #8a1c14);
  }

  #connectBtn:active {
    transform: translateY(1px);
  }

  .hud {
    position: relative;
    z-index: 150;
    display: flex;
    gap: 28px;
    margin-bottom: 32px;
    padding: 10px 22px;
    background: var(--panel);
    border: 1px solid #232b35;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }

  .hud-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 84px;
  }

  .hud-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    font-weight: 600;
    white-space: nowrap;
  }

  .hud-value {
    font-size: 24px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    transition: color 0.15s;
  }

  .controls {
    display: flex;
    flex: 1 1 auto;
    width: 100%;
  }

  .touch-zone {
    flex: 1 1 50%;
    height: 100%;
  }

  .floating-joystick {
    position: fixed;
    z-index: 500;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }

  .floating-joystick.visible {
    opacity: 1;
    visibility: visible;
  }

  .floating-joystick canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .hint {
    margin-top: 26px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .powered-by {
    position: fixed;
    bottom: max(10px, env(safe-area-inset-bottom));
    right: max(14px, env(safe-area-inset-right));
    font-size: 10px;
    color: var(--text-dim);
    opacity: 0.6;
    pointer-events: none;
  }

  .menu-toggle {
    position: fixed;
    top: max(8px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    z-index: 300;
    width: 34px;
    height: 34px;
    background: var(--panel);
    border: 1px solid #232b35;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .signal-icon {
    position: fixed;
    top: max(8px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    z-index: 150;
    display: flex;
    align-items: flex-end;
    pointer-events: none;
  }

  .signal-bar {
    transition: fill 0.2s ease;
  }

  .menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 290;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease;
  }

  .menu-overlay.open {
    opacity: 1;
    visibility: visible;
  }

  .menu-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(75vw, 280px);
    background: linear-gradient(160deg, #2a2d33 0%, #0a0a0b 55%, #000000 100%);
    box-shadow: -8px 0 28px rgba(0, 0, 0, 0.55);
    z-index: 295;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    flex-direction: column;
    padding: max(20px, env(safe-area-inset-top)) 18px 18px;
    gap: 14px;
  }

  .menu-panel.open {
    transform: translateX(0);
  }

  .menu-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .menu-title {
    font-size: 20px;
    font-weight: 800;
    color: #e6edf3;
    letter-spacing: 0.04em;
  }

  .menu-close {
    background: none;
    border: none;
    color: #e6edf3;
    font-size: 26px;
    line-height: 1;
    padding: 0 4px;
    cursor: pointer;
  }

  .menu-btn {
    background: #000;
    border: 1.5px solid #3b9eff;
    color: #e6edf3;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 16px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(59, 158, 255, 0.25);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }

  .menu-btn:active {
    background: #111;
    box-shadow: 0 0 16px rgba(59, 158, 255, 0.5);
  }

  .fuel-gauge {
    position: fixed;
    top: 50%;
    left: 25%;
    transform: translate(-50%, -50%);
    width: min(40vw, 380px, 90vh);
    z-index: 90;
    pointer-events: none;
  }

  .fuel-gauge svg {
    width: 100%;
    height: auto;
    display: block;
  }

  #gaugeNeedle {
    transform-origin: 100px 100px;
    transition: transform 3.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .speedometer {
    position: fixed;
    top: 50%;
    left: 75%;
    transform: translate(-50%, -50%);
    width: min(40vw, 380px, 90vh);
    z-index: 90;
    pointer-events: none;
  }

  .speedometer svg {
    width: 100%;
    height: auto;
    display: block;
  }

  #speedNeedle {
    transform-origin: 100px 100px;
    transition: transform 0.2s ease-out;
  }

  .splash-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #ffffff;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }

  .splash-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .splash-logo {
    width: min(300px, 55vw, 60vh);
    height: auto;
    animation: splash-pulse 1.6s ease-in-out infinite;
  }

  @keyframes splash-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  @media (orientation: landscape) {
    html, body {
      background-size:
        auto,
        auto 100vh,
        auto;
    }

    body {
      justify-content: flex-start;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }

    .brand {
      position: relative;
      left: auto;
      z-index: 150;
      transform: none;
      margin-bottom: 6px;
    }

    .brand-row {
      flex-direction: row;
      gap: 8px;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      font-size: 14px;
    }

    .brand-title {
      font-size: 17px;
    }

    .brand-sub {
      
    }

    .connection {
      padding: 5px 12px;
    }

    .hud {
      margin-bottom: 0;
      padding: 6px 16px;
      gap: 20px;
    }

    .hud-value {
      font-size: 18px;
    }

    .hint {
      display: none;
    }
  }
</style>
</head>
<body>

<script>
(() => {
  const AXIS_MAX = 1023;
  const SNAP_BACK_EASE = 0.25;
  const ACTIVE_THRESHOLD_RATIO = 0.25;

  function createFloatingJoystick({ zoneEl, axis, onChange }) {
    const wrapper = document.createElement('div');
    wrapper.className = 'floating-joystick';
    const canvas = document.createElement('canvas');
    wrapper.appendChild(canvas);
    document.body.appendChild(wrapper);

    const ctx = canvas.getContext('2d');

    let dpr = window.devicePixelRatio || 1;
    let W = 0, H = 0;
    let crossCenter = 0;
    let trackThickness = 0;
    let knobRadius = 0;
    let capsuleStart = 0, capsuleEnd = 0;
    let center = 0, travel = 0;
    let pos = 0;
    let dragging = false;
    let activePointerId = null;
    let animId = null;

    function clampVal(min, val, max) {
      return Math.min(Math.max(val, min), max);
    }

    function widgetSize() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      return axis === 'y'
        ? { w: clampVal(70, vh * 0.16, 100), h: clampVal(160, vh * 0.50, 280) }
        : { w: clampVal(180, vw * 0.40, 300), h: clampVal(70, vh * 0.18, 100) };
    }

    function layout() {
      dpr = window.devicePixelRatio || 1;
      const size = widgetSize();
      W = size.w;
      H = size.h;
      wrapper.style.width = W + 'px';
      wrapper.style.height = H + 'px';
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (axis === 'y') {
        crossCenter = W / 2;
        trackThickness = W * 0.55;
        knobRadius = trackThickness * 0.62;
        const arrowSpace = H * 0.16;
        capsuleStart = arrowSpace;
        capsuleEnd = H - arrowSpace;
      } else {
        crossCenter = H / 2;
        trackThickness = H * 0.55;
        knobRadius = trackThickness * 0.62;
        const arrowSpace = W * 0.16;
        capsuleStart = arrowSpace;
        capsuleEnd = W - arrowSpace;
      }

      center = (capsuleStart + capsuleEnd) / 2;
      travel = Math.max((capsuleEnd - capsuleStart) / 2 - knobRadius * 0.35, 0);
      pos = center;
    }

    function drawArrow(dir, active) {
      const gap = 12;
      const len = 20;
      const width = 16;

      let x, y, rotation;
      if (dir === 'up') { x = crossCenter; y = capsuleStart - gap; rotation = 0; }
      else if (dir === 'down') { x = crossCenter; y = capsuleEnd + gap; rotation = Math.PI; }
      else if (dir === 'left') { x = capsuleStart - gap; y = crossCenter; rotation = -Math.PI / 2; }
      else { x = capsuleEnd + gap; y = crossCenter; rotation = Math.PI / 2; }

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);

      ctx.beginPath();
      ctx.moveTo(0, -len / 2);
      ctx.lineTo(width / 2, len / 2);
      ctx.lineTo(-width / 2, len / 2);
      ctx.closePath();

      if (active) {
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--arrow-active').trim();
        ctx.shadowColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-glow').trim();
        ctx.shadowBlur = 14;
      } else {
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--arrow-idle').trim();
        ctx.shadowBlur = 0;
      }
      ctx.fill();
      ctx.restore();
    }

    function roundedCapsule(x, y, w, h, r) {
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, w, h, r);
      } else {
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      const offset = axis === 'y' ? center - pos : pos - center;
      const threshold = travel * ACTIVE_THRESHOLD_RATIO;

      if (axis === 'y') {
        drawArrow('up', offset > threshold);
        drawArrow('down', -offset > threshold);
      } else {
        drawArrow('left', -offset > threshold);
        drawArrow('right', offset > threshold);
      }

      let trackX, trackY, trackW, trackH;
      if (axis === 'y') {
        trackX = crossCenter - trackThickness / 2;
        trackY = capsuleStart;
        trackW = trackThickness;
        trackH = capsuleEnd - capsuleStart;
      } else {
        trackX = capsuleStart;
        trackY = crossCenter - trackThickness / 2;
        trackW = capsuleEnd - capsuleStart;
        trackH = trackThickness;
      }

      const trackGrad = ctx.createLinearGradient(trackX, trackY, trackX + trackW, trackY + trackH);
      trackGrad.addColorStop(0, '#1c232c');
      trackGrad.addColorStop(1, '#12161c');
      roundedCapsule(trackX, trackY, trackW, trackH, Math.min(trackW, trackH) / 2);
      ctx.fillStyle = trackGrad;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#2a3340';
      ctx.stroke();

      ctx.save();
      ctx.beginPath();
      if (axis === 'y') {
        ctx.moveTo(crossCenter, capsuleStart);
        ctx.lineTo(crossCenter, capsuleEnd);
      } else {
        ctx.moveTo(capsuleStart, crossCenter);
        ctx.lineTo(capsuleEnd, crossCenter);
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();

      const knobX = axis === 'y' ? crossCenter : pos;
      const knobY = axis === 'y' ? pos : crossCenter;

      ctx.save();
      ctx.shadowColor = 'rgba(59, 158, 255, 0.45)';
      ctx.shadowBlur = dragging ? 26 : 14;
      const knobGrad = ctx.createRadialGradient(
        knobX - knobRadius * 0.3, knobY - knobRadius * 0.3, knobRadius * 0.1,
        knobX, knobY, knobRadius
      );
      knobGrad.addColorStop(0, '#4fb3ff');
      knobGrad.addColorStop(1, '#1f6fbf');
      ctx.beginPath();
      ctx.arc(knobX, knobY, knobRadius, 0, Math.PI * 2);
      ctx.fillStyle = knobGrad;
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(knobX, knobY, knobRadius, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.stroke();
    }

    function emit() {
      if (travel <= 0) { onChange(0); return; }
      const raw = axis === 'y' ? (center - pos) / travel : (pos - center) / travel;
      onChange(Math.round(raw * AXIS_MAX));
    }

    function setFromClient(clientX, clientY) {
      const rect = wrapper.getBoundingClientRect();
      let coord = axis === 'y' ? (clientY - rect.top) : (clientX - rect.left);
      coord = clampVal(center - travel, coord, center + travel);
      pos = coord;
      draw();
      emit();
    }

    function showAt(clientX, clientY) {
      cancelAnimationFrame(animId);
      layout();
      const zoneRect = zoneEl.getBoundingClientRect();
      const left = clampVal(zoneRect.left, clientX - W / 2, zoneRect.right - W);
      const top = clampVal(zoneRect.top, clientY - H / 2, zoneRect.bottom - H);
      wrapper.style.left = left + 'px';
      wrapper.style.top = top + 'px';
      wrapper.classList.add('visible');
      dragging = true;
      pos = center;
      draw();
      emit();
    }

    function springBack() {
      cancelAnimationFrame(animId);
      const step = () => {
        const delta = center - pos;
        pos += delta * SNAP_BACK_EASE;
        draw();
        emit();
        if (Math.abs(delta) > 0.5) {
          animId = requestAnimationFrame(step);
        } else {
          pos = center;
          draw();
          emit();
          wrapper.classList.remove('visible');
        }
      };
      animId = requestAnimationFrame(step);
    }

    zoneEl.addEventListener('pointerdown', (e) => {
      if (activePointerId !== null) return;
      activePointerId = e.pointerId;
      zoneEl.setPointerCapture(e.pointerId);
      showAt(e.clientX, e.clientY);
    });

    zoneEl.addEventListener('pointermove', (e) => {
      if (e.pointerId !== activePointerId) return;
      setFromClient(e.clientX, e.clientY);
    });

    function endDrag(e) {
      if (e.pointerId !== activePointerId) return;
      activePointerId = null;
      dragging = false;
      springBack();
    }

    zoneEl.addEventListener('pointerup', endDrag);
    zoneEl.addEventListener('pointercancel', endDrag);

    return { resize: layout };
  }

  const xValEl = document.getElementById('xVal');
  const yValEl = document.getElementById('yVal');

  const DEFAULT_WS_URL = 'ws://192.168.4.1:8081';
  const SEND_INTERVAL_MS = 60;
  const RECONNECT_DELAY_MS = 2000;

  // Quick display-side battery calibration (no re-flash needed).
  // To tune: new value = (multimeter reading) / (voltage currently shown) * this value.
  const BATTERY_CALIBRATION = (12.05 / 11.86 );

  // ---- Fuel-style battery gauge ----
  const GAUGE_MIN_V = 10.5;
  const GAUGE_MAX_V = 12.8;
  const GAUGE_MIN_ANGLE = -120;
  const GAUGE_MAX_ANGLE = 120;
  const GAUGE_CX = 100;
  const GAUGE_CY = 100;

  function gaugeAngleFor(v) {
    const clamped = Math.min(Math.max(v, GAUGE_MIN_V), GAUGE_MAX_V);
    const ratio = (clamped - GAUGE_MIN_V) / (GAUGE_MAX_V - GAUGE_MIN_V);
    return GAUGE_MIN_ANGLE + ratio * (GAUGE_MAX_ANGLE - GAUGE_MIN_ANGLE);
  }

  function gaugePoint(radius, angleDeg) {
    const rad = angleDeg * Math.PI / 180;
    return {
      x: GAUGE_CX + radius * Math.sin(rad),
      y: GAUGE_CY - radius * Math.cos(rad)
    };
  }

  function buildGaugeFace() {
    const ticksGroup = document.getElementById('gaugeTicks');
    if (!ticksGroup) return;
    const NS = 'http://www.w3.org/2000/svg';

    // 9 marks evenly spaced across the sweep: 5 major (E, 1/4, 1/2, 3/4, F)
    // and 4 minor marks between them, same pattern as a classic fuel gauge.
    for (let i = 0; i <= 8; i++) {
      const angle = GAUGE_MIN_ANGLE + i * 30;
      const isMajor = i % 2 === 0;
      const outer = gaugePoint(80, angle);
      const inner = gaugePoint(isMajor ? 60 : 67, angle);
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', outer.x.toFixed(2));
      line.setAttribute('y1', outer.y.toFixed(2));
      line.setAttribute('x2', inner.x.toFixed(2));
      line.setAttribute('y2', inner.y.toFixed(2));
      line.setAttribute('stroke', '#f1f3f5');
      line.setAttribute('stroke-width', isMajor ? '5' : '3');
      line.setAttribute('stroke-linecap', 'round');
      ticksGroup.appendChild(line);
    }

    const labelE = document.getElementById('gaugeLabelE');
    if (labelE) {
      const p = gaugePoint(48, GAUGE_MIN_ANGLE);
      labelE.setAttribute('x', p.x.toFixed(2));
      labelE.setAttribute('y', (p.y + 5).toFixed(2));
    }

    const labelF = document.getElementById('gaugeLabelF');
    if (labelF) {
      const p = gaugePoint(48, GAUGE_MAX_ANGLE);
      labelF.setAttribute('x', p.x.toFixed(2));
      labelF.setAttribute('y', (p.y + 5).toFixed(2));
    }
  }

  function setGaugeAngle(angle) {
    const needle = document.getElementById('gaugeNeedle');
    if (needle) needle.style.transform = `rotate(${angle}deg)`;
  }

  function updateGaugeNeedle(voltage) {
    setGaugeAngle(gaugeAngleFor(voltage));
    const readout = document.getElementById('gaugeReadout');
    if (readout) readout.textContent = voltage.toFixed(2) + ' V';
  }

  function resetGaugeNeedle() {
    setGaugeAngle(GAUGE_MIN_ANGLE);
    const readout = document.getElementById('gaugeReadout');
    if (readout) readout.textContent = '-- V';
  }

  buildGaugeFace();
  setGaugeAngle(GAUGE_MIN_ANGLE);

  // ---- Speedometer (driven live by throttle input, 0-1023 -> 0-240 km/h) ----
  const SPEED_MAX_KMH = 240;
  // Raw axis value below which the car isn't actually moving yet (motor
  // friction/stall point) - tune this directly if it doesn't feel right.
  const SPEED_START_RAW = 213;
  const SPEED_MIN_ANGLE = -135;
  const SPEED_MAX_ANGLE = 135;
  const SPEED_CX = 100;
  const SPEED_CY = 100;

  function speedAngleFor(kmh) {
    const clamped = Math.min(Math.max(kmh, 0), SPEED_MAX_KMH);
    const ratio = clamped / SPEED_MAX_KMH;
    return SPEED_MIN_ANGLE + ratio * (SPEED_MAX_ANGLE - SPEED_MIN_ANGLE);
  }

  function speedPoint(radius, angleDeg) {
    const rad = angleDeg * Math.PI / 180;
    return {
      x: SPEED_CX + radius * Math.sin(rad),
      y: SPEED_CY - radius * Math.cos(rad)
    };
  }

  function buildSpeedFace() {
    const ticksGroup = document.getElementById('speedTicks');
    const labelsGroup = document.getElementById('speedLabels');
    if (!ticksGroup || !labelsGroup) return;
    const NS = 'http://www.w3.org/2000/svg';

    const STEP = 5;
    const totalSteps = SPEED_MAX_KMH / STEP;

    for (let i = 0; i <= totalSteps; i++) {
      const kmh = i * STEP;
      const isMajor = kmh % 20 === 0;
      const isMinor = !isMajor && kmh % 10 === 0;
      const angle = speedAngleFor(kmh);
      const outer = speedPoint(80, angle);
      const inner = speedPoint(isMajor ? 62 : isMinor ? 68 : 73, angle);
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', outer.x.toFixed(2));
      line.setAttribute('y1', outer.y.toFixed(2));
      line.setAttribute('x2', inner.x.toFixed(2));
      line.setAttribute('y2', inner.y.toFixed(2));
      line.setAttribute('stroke', '#f1f3f5');
      line.setAttribute('stroke-width', isMajor ? '3.5' : isMinor ? '2' : '1');
      line.setAttribute('stroke-linecap', 'round');
      ticksGroup.appendChild(line);

      if (isMajor) {
        const labelPos = speedPoint(52, angle);
        const text = document.createElementNS(NS, 'text');
        text.setAttribute('x', labelPos.x.toFixed(2));
        text.setAttribute('y', (labelPos.y + 4).toFixed(2));
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', '11');
        text.setAttribute('font-weight', '700');
        text.setAttribute('fill', '#e8ebee');
        text.setAttribute('font-family', '-apple-system, sans-serif');
        text.textContent = String(kmh);
        labelsGroup.appendChild(text);
      }
    }
  }

  function setSpeedAngle(angle) {
    const needle = document.getElementById('speedNeedle');
    if (needle) needle.style.transform = `rotate(${angle}deg)`;
  }

  function updateSpeedNeedle(rawAxisValue) {
    const mag = Math.abs(rawAxisValue);
    let kmh = 0;
    if (mag > SPEED_START_RAW) {
      kmh = ((mag - SPEED_START_RAW) / (AXIS_MAX - SPEED_START_RAW)) * SPEED_MAX_KMH;
    }
    setSpeedAngle(speedAngleFor(kmh));
  }

  function resetSpeedNeedle() {
    setSpeedAngle(SPEED_MIN_ANGLE);
  }

  buildSpeedFace();
  setSpeedAngle(SPEED_MIN_ANGLE);

  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const wsUrlInput = document.getElementById('wsUrlInput');
  const connectBtn = document.getElementById('connectBtn');
  const signalBars = document.querySelectorAll('.signal-bar');

  const ICON_CONNECT = '<svg viewBox="0 0 24 24" width="16" height="16"><rect x="9" y="2" width="2.2" height="6" rx="1" fill="#fff"/><rect x="12.8" y="2" width="2.2" height="6" rx="1" fill="#fff"/><rect x="7" y="7" width="10" height="6.5" rx="2.5" fill="#fff"/><path d="M12 13.5v4.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M8.5 18.5a3.5 3.5 0 0 0 7 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
  const ICON_DISCONNECT = '<svg viewBox="0 0 24 24" width="16" height="16"><rect x="9" y="2" width="2.2" height="6" rx="1" fill="#fff"/><rect x="12.8" y="2" width="2.2" height="6" rx="1" fill="#fff"/><rect x="7" y="7" width="10" height="6.5" rx="2.5" fill="#fff"/><path d="M12 13.5v4.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M8.5 18.5a3.5 3.5 0 0 0 7 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><line x1="3" y1="3" x2="21" y2="21" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';

  function setConnectIcon() {
    connectBtn.innerHTML = ICON_CONNECT;
    connectBtn.classList.remove('connected');
    connectBtn.setAttribute('aria-label', 'Connect');
  }

  function setDisconnectIcon() {
    connectBtn.innerHTML = ICON_DISCONNECT;
    connectBtn.classList.add('connected');
    connectBtn.setAttribute('aria-label', 'Disconnect');
  }

  setConnectIcon();

  wsUrlInput.value = localStorage.getItem('rc-ws-url') || DEFAULT_WS_URL;

  let ws = null;
  let manualDisconnect = false;
  let reconnectTimer = null;
  let sendTimer = null;
  let lastSentAt = 0;
  let lastX = 0;
  let lastY = 0;

  let lastMessageReceivedAt = 0;
  let signalCheckInterval = null;

  function setSignalBars(litCount) {
    signalBars.forEach((bar, i) => {
      bar.setAttribute('fill', i < litCount ? '#fff' : '#3a4552');
    });
  }

  // Firmware broadcasts a message every ~2s; the longer it's been since the
  // last one arrived, the weaker/less reliable the link is treated as.
  function litCountFromGap(gapMs) {
    if (gapMs <= 3000) return 5;
    if (gapMs <= 5000) return 4;
    if (gapMs <= 7000) return 3;
    if (gapMs <= 9000) return 2;
    if (gapMs <= 11000) return 1;
    return 0;
  }

  function checkSignalQuality() {
    setSignalBars(litCountFromGap(Date.now() - lastMessageReceivedAt));
  }

  function setStatus(state, text) {
    statusDot.dataset.state = state;
    statusText.textContent = text;

    if (state === 'disconnected') {
      setSignalBars(0);
    } else if (state === 'connecting') {
      setSignalBars(2);
    }
    // 'connected' state: bars are driven by checkSignalQuality() instead.
  }

  function sendNow() {
    lastSentAt = performance.now();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ x: lastX, y: lastY }));
    }
  }

  function scheduleSend() {
    const now = performance.now();
    const elapsed = now - lastSentAt;
    if (elapsed >= SEND_INTERVAL_MS) {
      sendNow();
    } else if (!sendTimer) {
      sendTimer = setTimeout(() => {
        sendTimer = null;
        sendNow();
      }, SEND_INTERVAL_MS - elapsed);
    }
  }

  function connectWS() {
    manualDisconnect = false;
    clearTimeout(reconnectTimer);

    const url = wsUrlInput.value.trim() || DEFAULT_WS_URL;
    localStorage.setItem('rc-ws-url', url);

    setStatus('connecting', 'Connecting…');
    setDisconnectIcon();

    try {
      ws = new WebSocket(url);
    } catch (err) {
      setStatus('disconnected', 'Invalid URL');
      setConnectIcon();
      return;
    }

    ws.onopen = () => {
      setStatus('connected', 'Connected');
      setDisconnectIcon();
      lastMessageReceivedAt = Date.now();
      setSignalBars(5);
      clearInterval(signalCheckInterval);
      signalCheckInterval = setInterval(checkSignalQuality, 1000);
      sendNow();
    };

    ws.onclose = () => {
      ws = null;
      clearInterval(signalCheckInterval);
      signalCheckInterval = null;
      setConnectIcon();
      resetGaugeNeedle();
      resetSpeedNeedle();
      if (manualDisconnect) {
        setStatus('disconnected', 'Disconnected');
      } else {
        setStatus('connecting', 'Reconnecting…');
        reconnectTimer = setTimeout(connectWS, RECONNECT_DELAY_MS);
      }
    };

    ws.onerror = () => {
      if (ws) ws.close();
    };

    ws.onmessage = (event) => {
      lastMessageReceivedAt = Date.now();
      let data;
      try {
        data = JSON.parse(event.data);
      } catch (err) {
        return;
      }
      if (typeof data.battery === 'number') {
        const calibrated = data.battery * BATTERY_CALIBRATION;
        updateGaugeNeedle(calibrated);
      }
    };
  }

  function disconnectWS() {
    manualDisconnect = true;
    clearTimeout(reconnectTimer);
    setStatus('disconnected', 'Disconnected');
    setConnectIcon();
    if (ws) ws.close();
  }

  connectBtn.addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      disconnectWS();
    } else if (ws) {
      manualDisconnect = true;
      clearTimeout(reconnectTimer);
      ws.close();
      setStatus('disconnected', 'Disconnected');
      setConnectIcon();
    } else {
      connectWS();
    }
  });

  const joyY = createFloatingJoystick({
    zoneEl: document.getElementById('zoneY'),
    axis: 'y',
    onChange: (v) => {
      yValEl.textContent = v;
      lastY = v;
      scheduleSend();
      if (ws && ws.readyState === WebSocket.OPEN) {
        updateSpeedNeedle(v);
      } else {
        resetSpeedNeedle();
      }
    }
  });

  const joyX = createFloatingJoystick({
    zoneEl: document.getElementById('zoneX'),
    axis: 'x',
    onChange: (v) => { xValEl.textContent = v; lastX = v; scheduleSend(); }
  });

  window.addEventListener('resize', () => {
    joyY.resize();
    joyX.resize();
  });

  joyY.resize();
  joyX.resize();

  const splashScreen = document.getElementById('splashScreen');
  if (splashScreen) {
    setTimeout(() => splashScreen.classList.add('hidden'), 300);
  }

  // ---- Side menu ----
  const menuToggle = document.getElementById('menuToggle');
  const menuOverlay = document.getElementById('menuOverlay');
  const menuPanel = document.getElementById('menuPanel');
  const menuClose = document.getElementById('menuClose');

  function openMenu() {
    menuOverlay.classList.add('open');
    menuPanel.classList.add('open');
  }

  function closeMenu() {
    menuOverlay.classList.remove('open');
    menuPanel.classList.remove('open');
  }

  menuToggle.addEventListener('click', () => {
    if (menuPanel.classList.contains('open')) {
      closeMenu();
    } else {
      openMenu();
    }
  });

  menuOverlay.addEventListener('click', closeMenu);
  menuClose.addEventListener('click', closeMenu);

  document.getElementById('menuAbout').addEventListener('click', closeMenu);
  document.getElementById('menuRecord').addEventListener('click', closeMenu);
  document.getElementById('menuPlay').addEventListener('click', closeMenu);
})();
</script>
</body>
</html>
