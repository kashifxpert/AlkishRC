<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Alkish Car Controller</title>
<style>
  :root {
    --bg: #000;
    --panel: #161b22;
    --outer-ring: #2a3340;
    --outer-fill: #1a2028;
    --accent: #3b9eff;
    --accent-glow: rgba(59, 158, 255, 0.55);
    --knob-top: #4fb3ff;
    --knob-bottom: #1f6fbf;
    --text: #e6edf3;
    --text-dim: #7d8a9a;
    --arrow-idle: #3a4552;
    --arrow-active: #3b9eff;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    background:
      radial-gradient(circle at 50% 30%, rgba(22, 28, 36, 0.80) 0%, rgba(13, 17, 23, 0.80) 70%),
      url('car-bg.jpeg') center 65% / auto 30vh no-repeat,
      var(--bg);
    overscroll-behavior: none;
    touch-action: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    user-select: none;
  }

  .brand {
    position: fixed;
    top: max(24px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .brand-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .brand-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    background: linear-gradient(135deg, var(--knob-top), var(--knob-bottom));
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  .brand-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.01em;
    line-height: 1;
    background: linear-gradient(135deg, #8fd0ff 0%, #3b9eff 55%, #1f6fbf 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-align: center;
  }

  .brand-sub {
    margin-top: 8px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding-left: 0.42em;
  }

  .connection {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
    padding: 9px 16px;
    background: var(--panel);
    border: 1px solid #232b35;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #555;
    flex-shrink: 0;
  }

  .status-dot[data-state="connected"] {
    background: #3ddc73;
    box-shadow: 0 0 8px rgba(61, 220, 115, 0.8);
  }

  .status-dot[data-state="connecting"] {
    background: #f5a623;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .status-text {
    font-size: 12px;
    color: var(--text-dim);
    min-width: 84px;
  }

  #wsUrlInput {
    background: #0d1117;
    border: 1px solid #2a3340;
    color: var(--text);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 13px;
    width: 190px;
    display: none;
  }

  #wsUrlInput:focus {
    outline: none;
    border-color: var(--accent);
  }

  #connectBtn {
    background: linear-gradient(135deg, var(--knob-top), var(--knob-bottom));
    border: none;
    color: #fff;
    padding: 7px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }

  #connectBtn:active {
    transform: translateY(1px);
  }

  .hud {
    display: flex;
    gap: 28px;
    margin-bottom: 32px;
    padding: 10px 22px;
    background: var(--panel);
    border: 1px solid #232b35;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }

  .hud-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 84px;
  }

  .hud-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    font-weight: 600;
    white-space: nowrap;
  }

  .hud-value {
    font-size: 24px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    transition: color 0.15s;
  }

  .controls {
    display: flex;
    flex: 1 1 auto;
    width: 100%;
  }

  .touch-zone {
    flex: 1 1 50%;
    height: 100%;
  }

  .floating-joystick {
    position: fixed;
    z-index: 500;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }

  .floating-joystick.visible {
    opacity: 1;
    visibility: visible;
  }

  .floating-joystick canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .hint {
    margin-top: 26px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .powered-by {
    position: fixed;
    bottom: max(10px, env(safe-area-inset-bottom));
    right: max(20px, env(safe-area-inset-right));
    font-size: 10px;
    color: var(--text-dim);
    opacity: 0.6;
    pointer-events: none;
  }

  .splash-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #ffffff;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }

  .splash-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .splash-logo {
    width: min(300px, 55vw, 60vh);
    height: auto;
    animation: splash-pulse 1.6s ease-in-out infinite;
  }

  @keyframes splash-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  @media (orientation: landscape) {
    body {
      justify-content: flex-start;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }

    .brand {
      position: static;
      transform: none;
      margin-bottom: 6px;
    }

    .brand-row {
      flex-direction: row;
      gap: 8px;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      font-size: 14px;
    }

    .brand-title {
      font-size: 17px;
    }

    .brand-sub {
      
    }

    .connection {
      margin-bottom: 8px;
      padding: 5px 12px;
    }

    .hud {
      margin-bottom: 0;
      padding: 6px 16px;
      gap: 20px;
    }

    .hud-value {
      font-size: 18px;
    }

    .hint {
      display: none;
    }
  }
</style>
</head>
<body>

  <div class="splash-screen" id="splashScreen">
    <img class="splash-logo" src="splash.png" alt="AlkisH Boom Boom" />
  </div>

  <div class="brand">
    <div class="brand-row">
      <div class="brand-icon">🏎️</div>
      <div class="brand-title" style="display:none;">AlkisH</div>
    </div>
    <div class="brand-sub">Bhoom22 Bhoom</div>
  </div>

  <div class="connection">
    <span class="status-dot" id="statusDot" data-state="disconnected"></span>
    <span class="status-text" id="statusText">Disconnected</span>
    <input type="text" id="wsUrlInput" placeholder="ws://192.168.4.1:81" />
    <button id="connectBtn">Connect</button>
  </div>

  <div class="hud" style="display:none;">
    <div class="hud-item">
      <span class="hud-label">Left / Right</span>
      <span class="hud-value" id="xVal">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Up / Down</span>
      <span class="hud-value" id="yVal">0</span>
    </div>
  </div>

  <div class="controls">
    <div class="touch-zone" id="zoneY"></div>
    <div class="touch-zone" id="zoneX"></div>
  </div>

  <div class="hint">Developed by Kashif Hussain</div>

  <div class="powered-by">Powered by Muztech Solutions</div>

<script>
(() => {
  const AXIS_MAX = 1023;
  const SNAP_BACK_EASE = 0.25;
  const ACTIVE_THRESHOLD_RATIO = 0.25;

  function createFloatingJoystick({ zoneEl, axis, onChange }) {
    const wrapper = document.createElement('div');
    wrapper.className = 'floating-joystick';
    const canvas = document.createElement('canvas');
    wrapper.appendChild(canvas);
    document.body.appendChild(wrapper);

    const ctx = canvas.getContext('2d');

    let dpr = window.devicePixelRatio || 1;
    let W = 0, H = 0;
    let crossCenter = 0;
    let trackThickness = 0;
    let knobRadius = 0;
    let capsuleStart = 0, capsuleEnd = 0;
    let center = 0, travel = 0;
    let pos = 0;
    let dragging = false;
    let activePointerId = null;
    let animId = null;

    function clampVal(min, val, max) {
      return Math.min(Math.max(val, min), max);
    }

    function widgetSize() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      return axis === 'y'
        ? { w: clampVal(70, vh * 0.16, 100), h: clampVal(160, vh * 0.50, 280) }
        : { w: clampVal(180, vw * 0.40, 300), h: clampVal(70, vh * 0.18, 100) };
    }

    function layout() {
      dpr = window.devicePixelRatio || 1;
      const size = widgetSize();
      W = size.w;
      H = size.h;
      wrapper.style.width = W + 'px';
      wrapper.style.height = H + 'px';
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (axis === 'y') {
        crossCenter = W / 2;
        trackThickness = W * 0.55;
        knobRadius = trackThickness * 0.62;
        const arrowSpace = H * 0.16;
        capsuleStart = arrowSpace;
        capsuleEnd = H - arrowSpace;
      } else {
        crossCenter = H / 2;
        trackThickness = H * 0.55;
        knobRadius = trackThickness * 0.62;
        const arrowSpace = W * 0.16;
        capsuleStart = arrowSpace;
        capsuleEnd = W - arrowSpace;
      }

      center = (capsuleStart + capsuleEnd) / 2;
      travel = Math.max((capsuleEnd - capsuleStart) / 2 - knobRadius * 0.35, 0);
      pos = center;
    }

    function drawArrow(dir, active) {
      const gap = 12;
      const len = 20;
      const width = 16;

      let x, y, rotation;
      if (dir === 'up') { x = crossCenter; y = capsuleStart - gap; rotation = 0; }
      else if (dir === 'down') { x = crossCenter; y = capsuleEnd + gap; rotation = Math.PI; }
      else if (dir === 'left') { x = capsuleStart - gap; y = crossCenter; rotation = -Math.PI / 2; }
      else { x = capsuleEnd + gap; y = crossCenter; rotation = Math.PI / 2; }

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);

      ctx.beginPath();
      ctx.moveTo(0, -len / 2);
      ctx.lineTo(width / 2, len / 2);
      ctx.lineTo(-width / 2, len / 2);
      ctx.closePath();

      if (active) {
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--arrow-active').trim();
        ctx.shadowColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-glow').trim();
        ctx.shadowBlur = 14;
      } else {
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--arrow-idle').trim();
        ctx.shadowBlur = 0;
      }
      ctx.fill();
      ctx.restore();
    }

    function roundedCapsule(x, y, w, h, r) {
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, w, h, r);
      } else {
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      const offset = axis === 'y' ? center - pos : pos - center;
      const threshold = travel * ACTIVE_THRESHOLD_RATIO;

      if (axis === 'y') {
        drawArrow('up', offset > threshold);
        drawArrow('down', -offset > threshold);
      } else {
        drawArrow('left', -offset > threshold);
        drawArrow('right', offset > threshold);
      }

      let trackX, trackY, trackW, trackH;
      if (axis === 'y') {
        trackX = crossCenter - trackThickness / 2;
        trackY = capsuleStart;
        trackW = trackThickness;
        trackH = capsuleEnd - capsuleStart;
      } else {
        trackX = capsuleStart;
        trackY = crossCenter - trackThickness / 2;
        trackW = capsuleEnd - capsuleStart;
        trackH = trackThickness;
      }

      const trackGrad = ctx.createLinearGradient(trackX, trackY, trackX + trackW, trackY + trackH);
      trackGrad.addColorStop(0, '#1c232c');
      trackGrad.addColorStop(1, '#12161c');
      roundedCapsule(trackX, trackY, trackW, trackH, Math.min(trackW, trackH) / 2);
      ctx.fillStyle = trackGrad;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#2a3340';
      ctx.stroke();

      ctx.save();
      ctx.beginPath();
      if (axis === 'y') {
        ctx.moveTo(crossCenter, capsuleStart);
        ctx.lineTo(crossCenter, capsuleEnd);
      } else {
        ctx.moveTo(capsuleStart, crossCenter);
        ctx.lineTo(capsuleEnd, crossCenter);
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();

      const knobX = axis === 'y' ? crossCenter : pos;
      const knobY = axis === 'y' ? pos : crossCenter;

      ctx.save();
      ctx.shadowColor = 'rgba(59, 158, 255, 0.45)';
      ctx.shadowBlur = dragging ? 26 : 14;
      const knobGrad = ctx.createRadialGradient(
        knobX - knobRadius * 0.3, knobY - knobRadius * 0.3, knobRadius * 0.1,
        knobX, knobY, knobRadius
      );
      knobGrad.addColorStop(0, '#4fb3ff');
      knobGrad.addColorStop(1, '#1f6fbf');
      ctx.beginPath();
      ctx.arc(knobX, knobY, knobRadius, 0, Math.PI * 2);
      ctx.fillStyle = knobGrad;
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(knobX, knobY, knobRadius, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.stroke();
    }

    function emit() {
      if (travel <= 0) { onChange(0); return; }
      const raw = axis === 'y' ? (center - pos) / travel : (pos - center) / travel;
      onChange(Math.round(raw * AXIS_MAX));
    }

    function setFromClient(clientX, clientY) {
      const rect = wrapper.getBoundingClientRect();
      let coord = axis === 'y' ? (clientY - rect.top) : (clientX - rect.left);
      coord = clampVal(center - travel, coord, center + travel);
      pos = coord;
      draw();
      emit();
    }

    function showAt(clientX, clientY) {
      cancelAnimationFrame(animId);
      layout();
      const zoneRect = zoneEl.getBoundingClientRect();
      const left = clampVal(zoneRect.left, clientX - W / 2, zoneRect.right - W);
      const top = clampVal(zoneRect.top, clientY - H / 2, zoneRect.bottom - H);
      wrapper.style.left = left + 'px';
      wrapper.style.top = top + 'px';
      wrapper.classList.add('visible');
      dragging = true;
      pos = center;
      draw();
      emit();
    }

    function springBack() {
      cancelAnimationFrame(animId);
      const step = () => {
        const delta = center - pos;
        pos += delta * SNAP_BACK_EASE;
        draw();
        emit();
        if (Math.abs(delta) > 0.5) {
          animId = requestAnimationFrame(step);
        } else {
          pos = center;
          draw();
          emit();
          wrapper.classList.remove('visible');
        }
      };
      animId = requestAnimationFrame(step);
    }

    zoneEl.addEventListener('pointerdown', (e) => {
      if (activePointerId !== null) return;
      activePointerId = e.pointerId;
      zoneEl.setPointerCapture(e.pointerId);
      showAt(e.clientX, e.clientY);
    });

    zoneEl.addEventListener('pointermove', (e) => {
      if (e.pointerId !== activePointerId) return;
      setFromClient(e.clientX, e.clientY);
    });

    function endDrag(e) {
      if (e.pointerId !== activePointerId) return;
      activePointerId = null;
      dragging = false;
      springBack();
    }

    zoneEl.addEventListener('pointerup', endDrag);
    zoneEl.addEventListener('pointercancel', endDrag);

    return { resize: layout };
  }

  const xValEl = document.getElementById('xVal');
  const yValEl = document.getElementById('yVal');

  const DEFAULT_WS_URL = 'ws://192.168.4.1:81';
  const SEND_INTERVAL_MS = 60;
  const RECONNECT_DELAY_MS = 2000;

  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const wsUrlInput = document.getElementById('wsUrlInput');
  const connectBtn = document.getElementById('connectBtn');

  wsUrlInput.value = localStorage.getItem('rc-ws-url') || DEFAULT_WS_URL;

  let ws = null;
  let manualDisconnect = false;
  let reconnectTimer = null;
  let sendTimer = null;
  let lastSentAt = 0;
  let lastX = 0;
  let lastY = 0;

  function setStatus(state, text) {
    statusDot.dataset.state = state;
    statusText.textContent = text;
  }

  function sendNow() {
    lastSentAt = performance.now();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ x: lastX, y: lastY }));
    }
  }

  function scheduleSend() {
    const now = performance.now();
    const elapsed = now - lastSentAt;
    if (elapsed >= SEND_INTERVAL_MS) {
      sendNow();
    } else if (!sendTimer) {
      sendTimer = setTimeout(() => {
        sendTimer = null;
        sendNow();
      }, SEND_INTERVAL_MS - elapsed);
    }
  }

  function connectWS() {
    manualDisconnect = false;
    clearTimeout(reconnectTimer);

    const url = wsUrlInput.value.trim() || DEFAULT_WS_URL;
    localStorage.setItem('rc-ws-url', url);

    setStatus('connecting', 'Connecting…');
    connectBtn.textContent = 'Cancel';

    try {
      ws = new WebSocket(url);
    } catch (err) {
      setStatus('disconnected', 'Invalid URL');
      connectBtn.textContent = 'Connect';
      return;
    }

    ws.onopen = () => {
      setStatus('connected', 'Connected');
      connectBtn.textContent = 'Disconnect';
      sendNow();
    };

    ws.onclose = () => {
      ws = null;
      connectBtn.textContent = 'Connect';
      if (manualDisconnect) {
        setStatus('disconnected', 'Disconnected');
      } else {
        setStatus('connecting', 'Reconnecting…');
        reconnectTimer = setTimeout(connectWS, RECONNECT_DELAY_MS);
      }
    };

    ws.onerror = () => {
      if (ws) ws.close();
    };
  }

  function disconnectWS() {
    manualDisconnect = true;
    clearTimeout(reconnectTimer);
    setStatus('disconnected', 'Disconnected');
    connectBtn.textContent = 'Connect';
    if (ws) ws.close();
  }

  connectBtn.addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      disconnectWS();
    } else if (ws) {
      manualDisconnect = true;
      clearTimeout(reconnectTimer);
      ws.close();
      setStatus('disconnected', 'Disconnected');
      connectBtn.textContent = 'Connect';
    } else {
      connectWS();
    }
  });

  const joyY = createFloatingJoystick({
    zoneEl: document.getElementById('zoneY'),
    axis: 'y',
    onChange: (v) => { yValEl.textContent = v; lastY = v; scheduleSend(); }
  });

  const joyX = createFloatingJoystick({
    zoneEl: document.getElementById('zoneX'),
    axis: 'x',
    onChange: (v) => { xValEl.textContent = v; lastX = v; scheduleSend(); }
  });

  window.addEventListener('resize', () => {
    joyY.resize();
    joyX.resize();
  });

  joyY.resize();
  joyX.resize();

  const splashScreen = document.getElementById('splashScreen');
  if (splashScreen) {
    setTimeout(() => splashScreen.classList.add('hidden'), 4000);
  }
})();
</script>
</body>
</html>
