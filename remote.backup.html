<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Alkish Car Controller</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --outer-ring: #2a3340;
    --outer-fill: #1a2028;
    --accent: #3b9eff;
    --accent-glow: rgba(59, 158, 255, 0.55);
    --knob-top: #4fb3ff;
    --knob-bottom: #1f6fbf;
    --text: #e6edf3;
    --text-dim: #7d8a9a;
    --arrow-idle: #3a4552;
    --arrow-active: #3b9eff;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(circle at 50% 30%, #161c24 0%, var(--bg) 70%);
    overscroll-behavior: none;
    touch-action: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    user-select: none;
  }

  .brand {
    position: fixed;
    top: max(24px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .brand-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .brand-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: linear-gradient(135deg, var(--knob-top), var(--knob-bottom));
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  .brand-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.01em;
    line-height: 1;
    background: linear-gradient(135deg, #8fd0ff 0%, #3b9eff 55%, #1f6fbf 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-align: center;
  }

  .brand-sub {
    margin-top: 8px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding-left: 0.42em;
  }

  .connection {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
    padding: 9px 16px;
    background: var(--panel);
    border: 1px solid #232b35;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #555;
    flex-shrink: 0;
  }

  .status-dot[data-state="connected"] {
    background: #3ddc73;
    box-shadow: 0 0 8px rgba(61, 220, 115, 0.8);
  }

  .status-dot[data-state="connecting"] {
    background: #f5a623;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .status-text {
    font-size: 12px;
    color: var(--text-dim);
    min-width: 84px;
  }

  #wsUrlInput {
    background: #0d1117;
    border: 1px solid #2a3340;
    color: var(--text);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 13px;
    width: 190px;
    display: none;
  }

  #wsUrlInput:focus {
    outline: none;
    border-color: var(--accent);
  }

  #connectBtn {
    background: linear-gradient(135deg, var(--knob-top), var(--knob-bottom));
    border: none;
    color: #fff;
    padding: 7px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }

  #connectBtn:active {
    transform: translateY(1px);
  }

  .hud {
    display: flex;
    gap: 28px;
    margin-bottom: 32px;
    padding: 10px 22px;
    background: var(--panel);
    border: 1px solid #232b35;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }

  .hud-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 84px;
  }

  .hud-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    font-weight: 600;
    white-space: nowrap;
  }

  .hud-value {
    font-size: 24px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    transition: color 0.15s;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(24px, 6vw, 56px);
    flex-wrap: wrap;
  }

  .axis-control {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .axis-caption {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .stage-vertical {
    position: relative;
    width: clamp(80px, 20vw, 108px);
    height: clamp(220px, 52vh, 340px);
  }

  .stage-horizontal {
    position: relative;
    width: clamp(220px, 60vw, 340px);
    height: clamp(80px, 20vh, 108px);
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }

  canvas.dragging {
    cursor: grabbing;
  }

  .hint {
    margin-top: 26px;
    font-size: 13px;
    color: var(--text-dim);
  }
</style>
</head>
<body>

  <div class="brand">
    <div class="brand-row">
      <div class="brand-icon">🏎️</div>
      <div class="brand-title">AlkisH</div>
    </div>
    <div class="brand-sub">Boom Boom</div>
  </div>

  <div class="connection">
    <span class="status-dot" id="statusDot" data-state="disconnected"></span>
    <span class="status-text" id="statusText">Disconnected</span>
    <input type="text" id="wsUrlInput" placeholder="ws://192.168.4.1:81" />
    <button id="connectBtn">Connect</button>
  </div>

  <div class="hud">
    <div class="hud-item">
      <span class="hud-label">Left / Right</span>
      <span class="hud-value" id="xVal">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Up / Down</span>
      <span class="hud-value" id="yVal">0</span>
    </div>
  </div>

  <div class="controls">
    <div class="axis-control">
      <div class="stage-vertical" id="stageY">
        <canvas id="joystickY"></canvas>
      </div>
      <div class="axis-caption">Up / Down</div>
    </div>
    <div class="axis-control">
      <div class="stage-horizontal" id="stageX">
        <canvas id="joystickX"></canvas>
      </div>
      <div class="axis-caption">Left / Right</div>
    </div>
  </div>

  <div class="hint">Developed by Kashif Hussain</div>

<script>
(() => {
  const AXIS_MAX = 1023;
  const SNAP_BACK_EASE = 0.25;
  const ACTIVE_THRESHOLD_RATIO = 0.25;

  function createAxisJoystick({ canvas, container, axis, onChange }) {
    const ctx = canvas.getContext('2d');

    let dpr = window.devicePixelRatio || 1;
    let W = 0, H = 0;
    let crossCenter = 0;
    let trackThickness = 0;
    let knobRadius = 0;
    let capsuleStart = 0, capsuleEnd = 0;
    let center = 0, travel = 0;
    let pos = 0;
    let dragging = false;
    let animId = null;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      const rect = container.getBoundingClientRect();
      W = rect.width;
      H = rect.height;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (axis === 'y') {
        crossCenter = W / 2;
        trackThickness = W * 0.55;
        knobRadius = trackThickness * 0.62;
        const arrowSpace = H * 0.16;
        capsuleStart = arrowSpace;
        capsuleEnd = H - arrowSpace;
      } else {
        crossCenter = H / 2;
        trackThickness = H * 0.55;
        knobRadius = trackThickness * 0.62;
        const arrowSpace = W * 0.16;
        capsuleStart = arrowSpace;
        capsuleEnd = W - arrowSpace;
      }

      center = (capsuleStart + capsuleEnd) / 2;
      travel = Math.max((capsuleEnd - capsuleStart) / 2 - knobRadius * 0.35, 0);

      if (!dragging) pos = center;
      draw();
      emit();
    }

    function drawArrow(dir, active) {
      const gap = 12;
      const len = 20;
      const width = 16;

      let x, y, rotation;
      if (dir === 'up') { x = crossCenter; y = capsuleStart - gap; rotation = 0; }
      else if (dir === 'down') { x = crossCenter; y = capsuleEnd + gap; rotation = Math.PI; }
      else if (dir === 'left') { x = capsuleStart - gap; y = crossCenter; rotation = -Math.PI / 2; }
      else { x = capsuleEnd + gap; y = crossCenter; rotation = Math.PI / 2; }

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);

      ctx.beginPath();
      ctx.moveTo(0, -len / 2);
      ctx.lineTo(width / 2, len / 2);
      ctx.lineTo(-width / 2, len / 2);
      ctx.closePath();

      if (active) {
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--arrow-active').trim();
        ctx.shadowColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-glow').trim();
        ctx.shadowBlur = 14;
      } else {
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--arrow-idle').trim();
        ctx.shadowBlur = 0;
      }
      ctx.fill();
      ctx.restore();
    }

    function roundedCapsule(x, y, w, h, r) {
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, w, h, r);
      } else {
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      const offset = axis === 'y' ? center - pos : pos - center;
      const threshold = travel * ACTIVE_THRESHOLD_RATIO;

      if (axis === 'y') {
        drawArrow('up', offset > threshold);
        drawArrow('down', -offset > threshold);
      } else {
        drawArrow('left', -offset > threshold);
        drawArrow('right', offset > threshold);
      }

      let trackX, trackY, trackW, trackH;
      if (axis === 'y') {
        trackX = crossCenter - trackThickness / 2;
        trackY = capsuleStart;
        trackW = trackThickness;
        trackH = capsuleEnd - capsuleStart;
      } else {
        trackX = capsuleStart;
        trackY = crossCenter - trackThickness / 2;
        trackW = capsuleEnd - capsuleStart;
        trackH = trackThickness;
      }

      const trackGrad = ctx.createLinearGradient(trackX, trackY, trackX + trackW, trackY + trackH);
      trackGrad.addColorStop(0, '#1c232c');
      trackGrad.addColorStop(1, '#12161c');
      roundedCapsule(trackX, trackY, trackW, trackH, Math.min(trackW, trackH) / 2);
      ctx.fillStyle = trackGrad;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#2a3340';
      ctx.stroke();

      ctx.save();
      ctx.beginPath();
      if (axis === 'y') {
        ctx.moveTo(crossCenter, capsuleStart);
        ctx.lineTo(crossCenter, capsuleEnd);
      } else {
        ctx.moveTo(capsuleStart, crossCenter);
        ctx.lineTo(capsuleEnd, crossCenter);
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();

      const knobX = axis === 'y' ? crossCenter : pos;
      const knobY = axis === 'y' ? pos : crossCenter;

      ctx.save();
      ctx.shadowColor = 'rgba(59, 158, 255, 0.45)';
      ctx.shadowBlur = dragging ? 26 : 14;
      const knobGrad = ctx.createRadialGradient(
        knobX - knobRadius * 0.3, knobY - knobRadius * 0.3, knobRadius * 0.1,
        knobX, knobY, knobRadius
      );
      knobGrad.addColorStop(0, '#4fb3ff');
      knobGrad.addColorStop(1, '#1f6fbf');
      ctx.beginPath();
      ctx.arc(knobX, knobY, knobRadius, 0, Math.PI * 2);
      ctx.fillStyle = knobGrad;
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(knobX, knobY, knobRadius, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.stroke();
    }

    function emit() {
      if (travel <= 0) { onChange(0); return; }
      const raw = axis === 'y' ? (center - pos) / travel : (pos - center) / travel;
      onChange(Math.round(raw * AXIS_MAX));
    }

    function setFromClient(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      let coord = axis === 'y' ? (clientY - rect.top) : (clientX - rect.left);
      coord = Math.min(Math.max(coord, center - travel), center + travel);
      pos = coord;
      draw();
      emit();
    }

    function springBack() {
      cancelAnimationFrame(animId);
      const step = () => {
        const delta = center - pos;
        pos += delta * SNAP_BACK_EASE;
        draw();
        emit();
        if (Math.abs(delta) > 0.5) {
          animId = requestAnimationFrame(step);
        } else {
          pos = center;
          draw();
          emit();
        }
      };
      animId = requestAnimationFrame(step);
    }

    canvas.addEventListener('pointerdown', (e) => {
      cancelAnimationFrame(animId);
      dragging = true;
      canvas.classList.add('dragging');
      canvas.setPointerCapture(e.pointerId);
      setFromClient(e.clientX, e.clientY);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      setFromClient(e.clientX, e.clientY);
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      canvas.classList.remove('dragging');
      springBack();
    }

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    return { resize };
  }

  const xValEl = document.getElementById('xVal');
  const yValEl = document.getElementById('yVal');

  const DEFAULT_WS_URL = 'ws://192.168.4.1:81';
  const SEND_INTERVAL_MS = 60;
  const RECONNECT_DELAY_MS = 2000;

  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const wsUrlInput = document.getElementById('wsUrlInput');
  const connectBtn = document.getElementById('connectBtn');

  wsUrlInput.value = localStorage.getItem('rc-ws-url') || DEFAULT_WS_URL;

  let ws = null;
  let manualDisconnect = false;
  let reconnectTimer = null;
  let sendTimer = null;
  let lastSentAt = 0;
  let lastX = 0;
  let lastY = 0;

  function setStatus(state, text) {
    statusDot.dataset.state = state;
    statusText.textContent = text;
  }

  function sendNow() {
    lastSentAt = performance.now();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ x: lastX, y: lastY }));
    }
  }

  function scheduleSend() {
    const now = performance.now();
    const elapsed = now - lastSentAt;
    if (elapsed >= SEND_INTERVAL_MS) {
      sendNow();
    } else if (!sendTimer) {
      sendTimer = setTimeout(() => {
        sendTimer = null;
        sendNow();
      }, SEND_INTERVAL_MS - elapsed);
    }
  }

  function connectWS() {
    manualDisconnect = false;
    clearTimeout(reconnectTimer);

    const url = wsUrlInput.value.trim() || DEFAULT_WS_URL;
    localStorage.setItem('rc-ws-url', url);

    setStatus('connecting', 'Connecting…');
    connectBtn.textContent = 'Cancel';

    try {
      ws = new WebSocket(url);
    } catch (err) {
      setStatus('disconnected', 'Invalid URL');
      connectBtn.textContent = 'Connect';
      return;
    }

    ws.onopen = () => {
      setStatus('connected', 'Connected');
      connectBtn.textContent = 'Disconnect';
      sendNow();
    };

    ws.onclose = () => {
      ws = null;
      connectBtn.textContent = 'Connect';
      if (manualDisconnect) {
        setStatus('disconnected', 'Disconnected');
      } else {
        setStatus('connecting', 'Reconnecting…');
        reconnectTimer = setTimeout(connectWS, RECONNECT_DELAY_MS);
      }
    };

    ws.onerror = () => {
      if (ws) ws.close();
    };
  }

  function disconnectWS() {
    manualDisconnect = true;
    clearTimeout(reconnectTimer);
    setStatus('disconnected', 'Disconnected');
    connectBtn.textContent = 'Connect';
    if (ws) ws.close();
  }

  connectBtn.addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      disconnectWS();
    } else if (ws) {
      manualDisconnect = true;
      clearTimeout(reconnectTimer);
      ws.close();
      setStatus('disconnected', 'Disconnected');
      connectBtn.textContent = 'Connect';
    } else {
      connectWS();
    }
  });

  const joyY = createAxisJoystick({
    canvas: document.getElementById('joystickY'),
    container: document.getElementById('stageY'),
    axis: 'y',
    onChange: (v) => { yValEl.textContent = v; lastY = v; scheduleSend(); }
  });

  const joyX = createAxisJoystick({
    canvas: document.getElementById('joystickX'),
    container: document.getElementById('stageX'),
    axis: 'x',
    onChange: (v) => { xValEl.textContent = v; lastX = v; scheduleSend(); }
  });

  window.addEventListener('resize', () => {
    joyY.resize();
    joyX.resize();
  });

  joyY.resize();
  joyX.resize();
})();
</script>
</body>
</html>
